name: SDCC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  z80:
    name: Z80 geometry tests bbox ${{ matrix.use_bbox }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        use_bbox: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4

      - uses: chrisbazley/strb_t/.github/actions/setup-sdcc@sdcc-toolchain

      - name: Compile, link and run portable tests
        run: |
          sdcc --version
          cmake -S . -B build-sdcc -DCMAKE_TOOLCHAIN_FILE=cmake/sdcc-z80.cmake \
            -DCMAKE_C_FLAGS="-mz80 --enable-warning 378" \
            -DUSE_OPTIONAL=ON -DWARNINGS_AS_ERRORS=OFF -DUSE_BBOX=${{ matrix.use_bbox }}
          set -o pipefail
          cmake --build build-sdcc --parallel 2 2>&1 | tee build-sdcc/build.log
          ctest --test-dir build-sdcc --output-on-failure

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-z80-bbox-${{ matrix.use_bbox }}
          path: |
            build-sdcc/build.log
            build-sdcc/CMakeFiles/3dObj.dir/*.asm
            build-sdcc/tests/sdcc/*-output.log
            build-sdcc/tests/sdcc/*-simulator.log
            build-sdcc/tests/sdcc/*.map
          if-no-files-found: ignore
