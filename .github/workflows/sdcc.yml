name: SDCC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mos65c02:
    name: 65C02 geometry tests bbox ${{ matrix.use_bbox }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        use_bbox: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4

      # r17230 omits the mos65c02-stack-auto runtime used by these tests.
      - name: Cache SDCC snapshot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdcc.tar.bz2
          key: sdcc-linux-amd64-17200-c5934a4c06f0d415

      - name: Download SDCC trunk r17200
        shell: bash
        run: |
          archive="$RUNNER_TEMP/sdcc.tar.bz2"
          if test ! -f "$archive"; then
            curl --fail --location --retry 3 --max-time 180 \
              https://downloads.sourceforge.net/project/sdcc/snapshot_builds/amd64-unknown-linux2.5/sdcc-snapshot-amd64-unknown-linux2.5-20261114-17200-cf-x86.tar.bz2 \
              --output "$archive"
          fi
          echo "c5934a4c06f0d415cddb5c9cb42cb50861421c6dcd387432ad28e022dd4bc0fa  $archive" | sha256sum --check
          tar --no-same-owner -xjf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sdcc/bin" >> "$GITHUB_PATH"

      - name: Compile, link and run portable tests
        run: |
          sdcc --version
          cmake -S . -B build-sdcc -DCMAKE_TOOLCHAIN_FILE=cmake/sdcc-65c02.cmake \
            -DUSE_OPTIONAL=ON -DWARNINGS_AS_ERRORS=OFF -DUSE_BBOX=${{ matrix.use_bbox }}
          set -o pipefail
          cmake --build build-sdcc --parallel 2 2>&1 | tee build-sdcc/build.log
          ctest --test-dir build-sdcc --output-on-failure

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-65c02-bbox-${{ matrix.use_bbox }}
          path: |
            build-sdcc/build.log
            build-sdcc/CMakeFiles/3dObj.dir/*.asm
            build-sdcc/tests/sdcc/*-output.log
            build-sdcc/tests/sdcc/*-simulator.log
            build-sdcc/tests/sdcc/*.map
          if-no-files-found: ignore
